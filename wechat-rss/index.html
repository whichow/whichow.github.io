<div class="card">
<h1>微信公众号 RSS</h1>
<p>GitHub Actions 版本已经安装。</p>
<p>首次使用需要完成 <b>WeChat RSS Login</b> 扫码登录。登录成功后，运行 <b>WeChat RSS Sync</b>，在 <code>source</code> 中粘贴任意一篇目标公众号文章链接。</p>
<p>之后系统每 6 小时自动同步，并在这里生成文章列表和 RSS。</p>

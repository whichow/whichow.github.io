<div class="card"><h1>微信公众号 RSS</h1><p>已切换为<strong>免扫码版</strong>：不使用微信读书，也不需要微信登录。</p>
<p>数据源使用搜狗微信公开检索。前往 GitHub Actions → <b>WeChat RSS Sync</b> → Run workflow，在 <code>source</code> 输入公众号准确名称或微信号即可添加。</p>
<p>添加后每 6 小时自动同步。</p></div>

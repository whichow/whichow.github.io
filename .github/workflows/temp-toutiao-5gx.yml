name: Temp Toutiao Extract 5GX

on:
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install requests curl_cffi
          sudo apt-get update -y >/dev/null
          sudo apt-get install -y ffmpeg >/dev/null
      - name: Extract
        run: |
          rm -rf output
          mkdir -p output
          python tools/toutiao_video_extract.py "https://m.toutiao.com/is/5-GXBESEUR4/" --out output
          test -s output/video.mp4
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,codec_type,width,height -of json output/video.mp4 > output/media_info.json
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toutiao-temp-5GX-${{ github.run_id }}
          path: output/
          if-no-files-found: error
          retention-days: 7

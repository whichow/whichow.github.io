name: XHS Note Extractor

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Xiaohongshu share or note URL"
        required: true
        type: string
  workflow_call:
    inputs:
      url:
        description: "Xiaohongshu share or note URL"
        required: true
        type: string

permissions:
  contents: read

env:
  XHS_URL: ${{ inputs.url }}

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: |
          go install github.com/tamnd/xiaohongshu-cli/cmd/xhs@latest
          pip install requests
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Extract note metadata
        shell: bash
        run: |
          rm -rf output
          mkdir -p output
          echo "Input: $XHS_URL"
          "$(go env GOPATH)/bin/xhs" note "$XHS_URL" -o json > output/note.json
          cat output/note.json

      - name: Download media
        shell: bash
        run: |
          python tools/xhs_note_download.py output
          find output -maxdepth 2 -type f -printf '%p %s bytes\n' | sort

      - name: Validate
        shell: bash
        run: |
          test -s output/note.json
          test -s output/result.json
          python - <<'PY'
          import json, pathlib
          r=json.loads(pathlib.Path("output/result.json").read_text())
          assert r.get("downloaded"), "no media downloaded"
          print("XHS extraction validated.")
          PY

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xhs-extract-${{ github.run_id }}
          path: output/
          if-no-files-found: error
          retention-days: 7

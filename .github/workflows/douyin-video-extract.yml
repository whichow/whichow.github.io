name: Douyin Video Extractor

on:
  push:
    paths:
      - ".requests/douyin-video-*"
  workflow_dispatch:
    inputs:
      url:
        description: "Douyin share URL or share text"
        required: true
        type: string

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22.20.0"

      - name: Prepare pinned Shiying parser
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.9.0 --activate
          rm -rf /tmp/shiying
          git clone https://github.com/xlongDev/shiying.git /tmp/shiying
          cd /tmp/shiying
          git checkout 06be9ed13440683b5c9bc6158ffccd9745159804
          pnpm install --frozen-lockfile

      - name: Detect Chrome
        shell: bash
        run: |
          set -euo pipefail
          CHROME=""
          for p in /usr/bin/google-chrome /usr/bin/google-chrome-stable /usr/bin/chromium /usr/bin/chromium-browser; do
            if [ -x "$p" ]; then CHROME="$p"; break; fi
          done
          if [ -z "$CHROME" ]; then
            echo "Chrome not found on runner"
            exit 1
          fi
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
          echo "Using $CHROME"

      - name: Start parser service
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/shiying
          nohup pnpm exec next dev -H 127.0.0.1 -p 3000 >/tmp/shiying.log 2>&1 &
          echo $! >/tmp/shiying.pid
          for i in {1..90}; do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/shiying.log || true
          exit 1

      - name: Extract Douyin media
        shell: bash
        env:
          RAW_INPUT: ${{ github.event_name == 'push' && github.event.head_commit.message || inputs.url }}
        run: |
          set -euo pipefail
          rm -rf output
          mkdir -p output

          python3 - <<'PY' > /tmp/request.json
          import json, os, re
          text=os.environ["RAW_INPUT"]
          m=re.search(r'https?://(?:v\.)?douyin\.com/[^\s]+', text)
          if not m:
              m=re.search(r'https?://www\.douyin\.com/[^\s]+', text)
          if not m:
              raise SystemExit("No Douyin URL found")
          url=m.group(0).rstrip('，。,.!！?？;；')
          print(json.dumps({"url":url,"skipLivePhoto":True},ensure_ascii=False))
          PY

          curl -sS -X POST             -H "Content-Type: application/json"             --data-binary @/tmp/request.json             "http://127.0.0.1:3000/api/parse?skipLivePhoto=true"             -o output/api_response.json

          python3 - <<'PY'
          import json, pathlib
          p=pathlib.Path("output/api_response.json")
          obj=json.loads(p.read_text(encoding="utf-8"))
          if not obj.get("ok"):
              print(json.dumps(obj,ensure_ascii=False,indent=2))
              raise SystemExit("Douyin parse failed")
          d=obj.get("data") or {}
          if not d.get("awemeId"):
              raise SystemExit("missing awemeId")
          if d.get("isImagePost"):
              raise SystemExit("Current extractor is video-only; got image post")
          if not d.get("videoUrl"):
              raise SystemExit("missing videoUrl")
          pathlib.Path("output/result.json").write_text(
              json.dumps(d,ensure_ascii=False,indent=2),
              encoding="utf-8"
          )
          pathlib.Path("/tmp/video_url.txt").write_text(d["videoUrl"],encoding="utf-8")
          print(json.dumps({
              "awemeId":d.get("awemeId"),
              "desc":d.get("desc"),
              "author":(d.get("author") or {}).get("name"),
              "duration":d.get("duration"),
              "contentType":d.get("contentType")
          },ensure_ascii=False,indent=2))
          PY

          ENC_VIDEO="$(python3 - <<'PY'
          import pathlib, urllib.parse
          u=pathlib.Path("/tmp/video_url.txt").read_text(encoding="utf-8")
          print(urllib.parse.quote(u,safe=""))
          PY
          )"

          curl -fL --retry 3 --retry-all-errors             "http://127.0.0.1:3000/api/stream?url=$ENC_VIDEO"             -o output/video.mp4

          test -s output/video.mp4
          ffprobe -v error             -show_entries format=duration,size             -show_entries stream=codec_name,codec_type,width,height             -of json output/video.mp4 > output/media_info.json || true

      - name: Validate output
        shell: bash
        run: |
          set -euo pipefail
          test -s output/result.json
          test -s output/video.mp4
          python3 - <<'PY'
          import json, pathlib
          r=json.loads(pathlib.Path("output/result.json").read_text(encoding="utf-8"))
          n=pathlib.Path("output/video.mp4").stat().st_size
          assert r.get("awemeId")
          assert n > 10000
          print(f"Validated {r['awemeId']} - {n} bytes")
          PY

      - name: Upload extraction artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: douyin-extract-${{ github.run_id }}
          path: |
            output/
            /tmp/shiying.log
          if-no-files-found: warn
          retention-days: 7

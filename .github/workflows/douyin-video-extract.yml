name: Douyin Video Extractor

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Douyin share URL"
        required: true
        type: string

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Extract Douyin video
        shell: bash
        run: |
          rm -rf output
          python3 tools/douyin_video_extract.py "${{ inputs.url }}" --out output
          cat output/result.json
          test -s output/video.mp4
      - name: Upload extraction artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: douyin-extract-${{ github.run_id }}
          path: output/
          if-no-files-found: error
          retention-days: 7

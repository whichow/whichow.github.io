name: Zhihu Article Extractor

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Zhihu Zhuanlan article URL"
        required: true
        type: string
  repository_dispatch:
    types: [extract_zhihu_article]
  workflow_call:
    inputs:
      url:
        description: "Zhihu Zhuanlan article URL"
        required: true
        type: string

permissions:
  contents: read

env:
  ZHIHU_URL: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.url || inputs.url || 'https://zhuanlan.zhihu.com/p/2085400278489101833' }}

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser extractor
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright "playwright-stealth>=2.0.0" markdownify
          python -m playwright install --with-deps chromium

      - name: Extract Zhihu article
        shell: bash
        run: |
          rm -rf output
          mkdir -p output
          echo "Input: $ZHIHU_URL"
          python tools/zhihu_article_extract.py "$ZHIHU_URL" --out output
          cat output/result.json
          test -s output/result.md
          test -s output/content.txt
          test -s output/content.html

      - name: Write run summary
        if: always()
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          path = Path("output/result.json")
          print("# Zhihu article extraction")
          if not path.exists():
              print("- No result.json was generated.")
              raise SystemExit(0)

          data = json.loads(path.read_text(encoding="utf-8"))
          print(f"- Success: {data.get('success')}")
          print(f"- Title: {data.get('title', '')}")
          print(f"- Author: {data.get('author', '')}")
          print(f"- HTTP status: {data.get('http_status')}")
          print(f"- Extraction method: {data.get('extraction_method', '')}")
          print(f"- Text length: {data.get('text_length', 0)}")
          PY

      - name: Upload extraction artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zhihu-article-${{ github.run_id }}
          path: output/
          if-no-files-found: error
          retention-days: 7

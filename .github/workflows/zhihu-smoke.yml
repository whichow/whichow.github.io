name: Zhihu Extractor Smoke Test

on:
  push:
    branches:
      - zhihu-extractor-smoke-test
    paths:
      - ".github/workflows/zhihu-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install playwright "playwright-stealth>=2.0.0" markdownify
          python -m playwright install --with-deps chromium
      - name: Extract
        run: |
          python tools/zhihu_article_extract.py "https://zhuanlan.zhihu.com/p/2085400278489101833" --out output
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("output/result.json").read_text(encoding="utf-8"))
          assert data["success"] is True
          assert data["text_length"] > 9000
          assert "Jev" in data["title"]
          print("SMOKE_OK", data["title"], data["text_length"], data["extraction_method"])
          PY

name: Temp Xiaohongshu One-off Extract
on:
  push:
    paths:
      - ".requests/xhs-one-*"
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare parser
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/shizhen
          git clone https://github.com/hiyufan/shizhen.git /tmp/shizhen
          cd /tmp/shizhen
          git checkout f25a6a7da753e71888a3fec00b8b4a85610f890e
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Extract
        shell: bash
        env:
          PYTHONPATH: /tmp/shizhen/src
        run: |
          set -euo pipefail
          rm -rf output
          python tools/xiaohongshu_extract.py "https://xhslink.cn/o/8O35Q3PZ7YC" --out output
          cat output/result.json
          if [ -s output/video.mp4 ]; then
            ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,codec_type,width,height -of json output/video.mp4 > output/media_info.json || true
          fi
          cd output
          zip -qr ../xiaohongshu-media.zip .
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xhs-one-${{ github.run_id }}
          path: |
            output/
            xiaohongshu-media.zip
          if-no-files-found: warn
          retention-days: 7

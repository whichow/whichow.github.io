name: Temporary WeChat Article Extract

on:
  push:
    paths:
      - ".github/article-extract-request.json"

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      REDFOX_API_KEY: ${{ secrets.REDFOX_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install requests beautifulsoup4
      - name: Extract article privately
        shell: bash
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup

          req = json.loads(Path(".github/article-extract-request.json").read_text("utf-8"))
          url = req["url"]
          key = os.environ.get("REDFOX_API_KEY","").strip()
          if not key:
              raise SystemExit("REDFOX_API_KEY missing")

          r = requests.post(
              "https://redfox.hk/story/api/gzh/ability/temp/article/content",
              json={"articleUrl": url},
              headers={"REDFOX_API_KEY": key, "Content-Type": "application/json"},
              timeout=60,
          )
          payload = r.json()
          data = payload.get("data") if isinstance(payload, dict) else {}
          if not isinstance(data, dict):
              data = {}
          html = str(data.get("articleContent") or "")
          images = data.get("imageUrls") if isinstance(data.get("imageUrls"), list) else []

          soup = BeautifulSoup(html, "html.parser")
          for tag in soup(["script","style"]):
              tag.decompose()
          text = soup.get_text("\n", strip=True)
          text = re.sub(r"\n{3,}", "\n\n", text).strip()

          out = {
              "url": url,
              "http_status": r.status_code,
              "code": payload.get("code") if isinstance(payload, dict) else None,
              "message": (payload.get("msg") or payload.get("message") or "") if isinstance(payload, dict) else "",
              "text": text,
              "html": html,
              "imageUrls": images,
          }
          Path("article_extract").mkdir(exist_ok=True)
          Path("article_extract/article.json").write_text(json.dumps(out, ensure_ascii=False, indent=2), "utf-8")
          print(f"Extracted text chars={len(text)}, images={len(images)}, code={out['code']}")
          if not html and not text:
              raise SystemExit("Article content is empty")
          PY
      - name: Upload private artifact
        uses: actions/upload-artifact@v4
        with:
          name: wechat-article-extract
          path: article_extract/article.json
          retention-days: 1

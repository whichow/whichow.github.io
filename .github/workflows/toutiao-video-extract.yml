name: Toutiao Video Extractor

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Toutiao short link or /video/ URL"
        required: true
        type: string
  repository_dispatch:
    types: [extract_toutiao_video]
  workflow_call:
    inputs:
      url:
        description: "Toutiao short link or /video/ URL"
        required: true
        type: string
  push:
    branches:
      - toutiao-video-extract-7688644560120971315
    paths:
      - "tools/toutiao_video_extract.py"
      - ".github/workflows/toutiao-video-extract.yml"

permissions:
  contents: read

env:
  TOUTIAO_URL: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.url || inputs.url || 'https://m.toutiao.com/is/pso4hdMSQQI/' }}

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests curl_cffi yt-dlp faster-whisper
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg

      - name: Extract real Toutiao video
        id: extract
        continue-on-error: true
        shell: bash
        run: |
          rm -rf output
          mkdir -p output
          echo "Input: $TOUTIAO_URL"
          python tools/toutiao_video_extract.py "$TOUTIAO_URL" --out output
          cat output/result.json || true
          ls -lah output || true

      - name: yt-dlp fallback
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          if [ ! -s output/video.mp4 ]; then
            yt-dlp \
              --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/130.0.0.0 Safari/537.36" \
              --referer "https://www.toutiao.com/" \
              --no-playlist \
              --write-info-json \
              --write-auto-subs \
              --sub-langs "zh.*,en.*" \
              --merge-output-format mp4 \
              -o "output/video.%(ext)s" \
              "$TOUTIAO_URL" || true
          fi
          ls -lah output || true

      - name: Extract audio
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          VID="$(find output -maxdepth 1 -type f \( -name 'video.mp4' -o -name 'video.webm' -o -name 'video.mkv' \) | head -n1)"
          if [ -n "$VID" ]; then
            ffmpeg -y -i "$VID" -vn -ac 1 -ar 16000 -c:a pcm_s16le output/audio.wav
          fi
          ls -lah output || true

      - name: Transcribe actual audio
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          if [ -s output/audio.wav ]; then
            cat > /tmp/transcribe.py <<'PY'
          import json
          from pathlib import Path
          from faster_whisper import WhisperModel

          audio = "output/audio.wav"
          model = WhisperModel("small", device="cpu", compute_type="int8")
          segments, info = model.transcribe(
              audio,
              language="zh",
              beam_size=5,
              vad_filter=True,
              condition_on_previous_text=True,
          )

          rows = []
          lines = []
          for s in segments:
              text = s.text.strip()
              rows.append({
                  "start": round(s.start, 3),
                  "end": round(s.end, 3),
                  "text": text,
              })
              lines.append(f"[{s.start:8.2f} - {s.end:8.2f}] {text}")

          Path("output/transcript.txt").write_text("\n".join(lines), encoding="utf-8")
          Path("output/transcript.json").write_text(
              json.dumps(
                  {
                      "language": info.language,
                      "language_probability": info.language_probability,
                      "duration": info.duration,
                      "segments": rows,
                  },
                  ensure_ascii=False,
                  indent=2,
              ),
              encoding="utf-8",
          )
          print("\n".join(lines))
          PY
            python /tmp/transcribe.py
          fi

      - name: Write run summary
        if: always()
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          result_path = Path("output/result.json")
          transcript_path = Path("output/transcript.txt")

          print("# Toutiao extraction")
          if result_path.exists():
              result = json.loads(result_path.read_text(encoding="utf-8"))
              print(f"- Video ID: {result.get('video_id', '')}")
              print(f"- Title: {result.get('title', '')}")
              dl = result.get("download") or {}
              print(f"- Media type: {dl.get('content_type', '')}")
              print(f"- Downloaded bytes: {dl.get('bytes', '')}")
              print(f"- Errors: {len(result.get('errors') or [])}")
          if transcript_path.exists():
              text_value = transcript_path.read_text(encoding="utf-8")
              print("\n## Transcript preview\n")
              print("~~~text")
              print(text_value[:4000])
              print("~~~")
          PY

      - name: Validate output
        if: always()
        shell: bash
        run: |
          test -s output/result.json
          test -s output/video.mp4
          test -s output/transcript.txt
          echo "Extraction validated."

      - name: Upload extraction artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toutiao-extract-${{ github.run_id }}
          path: output/
          if-no-files-found: error
          retention-days: 7

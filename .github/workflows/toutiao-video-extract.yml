name: Toutiao Video Extractor

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Toutiao short link or /video/ URL"
        required: true
        type: string
  repository_dispatch:
    types: [extract_toutiao_video]
  workflow_call:
    inputs:
      url:
        description: "Toutiao short link or /video/ URL"
        required: true
        type: string
permissions:
  contents: read

env:
  TOUTIAO_URL: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.url || inputs.url || 'https://m.toutiao.com/is/pso4hdMSQQI/' }}

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests curl_cffi yt-dlp faster-whisper selenium
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg

      - name: Extract real Toutiao video
        id: extract
        continue-on-error: true
        shell: bash
        run: |
          rm -rf output
          mkdir -p output
          echo "Input: $TOUTIAO_URL"
          python tools/toutiao_video_extract.py "$TOUTIAO_URL" --out output
          cat output/result.json || true
          ls -lah output || true

      - name: yt-dlp fallback
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          if [ ! -s output/video.mp4 ]; then
            yt-dlp \
              --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/130.0.0.0 Safari/537.36" \
              --referer "https://www.toutiao.com/" \
              --no-playlist \
              --write-info-json \
              --write-auto-subs \
              --sub-langs "zh.*,en.*" \
              --merge-output-format mp4 \
              -o "output/video.%(ext)s" \
              "$TOUTIAO_URL" || true
          fi

          # Toutiao share links can resolve to Douyin. yt-dlp can identify these
          # but Douyin may require fresh, non-login browser cookies. Warm a clean
          # Chrome profile on Douyin, then retry with that cookie jar.
          if [ ! -s output/video.mp4 ]; then
            VID="$(python - <<'PY'
          import json
          from pathlib import Path
          p = Path("output/result.json")
          if p.exists():
              try:
                  print(json.loads(p.read_text(encoding="utf-8")).get("video_id", ""))
              except Exception:
                  pass
          PY
            )"
            CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
            if [ -n "$VID" ] && [ -n "$CHROME" ]; then
              PROFILE="/tmp/douyin-chrome-profile"
              rm -rf "$PROFILE"
              mkdir -p "$PROFILE"
              timeout 25s "$CHROME" \
                --headless=new \
                --no-sandbox \
                --disable-gpu \
                --disable-dev-shm-usage \
                --user-data-dir="$PROFILE" \
                --virtual-time-budget=7000 \
                --dump-dom "https://www.douyin.com/" >/tmp/douyin-home.html 2>/tmp/douyin-chrome-home.log || true
              timeout 25s "$CHROME" \
                --headless=new \
                --no-sandbox \
                --disable-gpu \
                --disable-dev-shm-usage \
                --user-data-dir="$PROFILE" \
                --virtual-time-budget=10000 \
                --dump-dom "https://www.douyin.com/video/$VID" >/tmp/douyin-video.html 2>/tmp/douyin-chrome-video.log || true
              yt-dlp \
                --cookies-from-browser "chrome:$PROFILE" \
                --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/130.0.0.0 Safari/537.36" \
                --referer "https://www.douyin.com/" \
                --no-playlist \
                --write-info-json \
                --merge-output-format mp4 \
                -o "output/video.%(ext)s" \
                "https://www.douyin.com/video/$VID" || true
            fi
          fi
          ls -lah output || true

      - name: Browser media fallback
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          if [ ! -s output/video.mp4 ]; then
            cat > /tmp/douyin_browser_extract.py <<'PY'
          import json
          import time
          from pathlib import Path
          from urllib.parse import urlparse

          import requests
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait

          out = Path("output")
          result_path = out / "result.json"
          report = json.loads(result_path.read_text(encoding="utf-8")) if result_path.exists() else {}
          vid = str(report.get("video_id") or "")
          if not vid:
              raise SystemExit("no video id")

          target = f"https://www.douyin.com/video/{vid}"
          opts = Options()
          opts.add_argument("--headless=new")
          opts.add_argument("--no-sandbox")
          opts.add_argument("--disable-gpu")
          opts.add_argument("--disable-dev-shm-usage")
          opts.add_argument("--autoplay-policy=no-user-gesture-required")
          opts.add_argument("--window-size=1280,900")
          opts.set_capability("goog:loggingPrefs", {"performance": "ALL"})

          driver = webdriver.Chrome(options=opts)
          candidates = []
          seen = set()
          debug = {"target": target, "video_id": vid, "candidates": [], "errors": []}

          def add(url, source="", mime=""):
              if not isinstance(url, str):
                  return
              url = url.strip()
              if not url or url.startswith("blob:") or not url.startswith(("http://", "https://")):
                  return
              if url in seen:
                  return
              seen.add(url)
              candidates.append((url, source, mime))
              debug["candidates"].append({"url": url, "source": source, "mime": mime})

          try:
              driver.get(target)
              try:
                  WebDriverWait(driver, 15).until(lambda d: d.find_elements(By.TAG_NAME, "video"))
              except Exception:
                  pass
              time.sleep(8)

              try:
                  debug["title"] = driver.title
                  debug["current_url"] = driver.current_url
                  debug["user_agent"] = driver.execute_script("return navigator.userAgent")
              except Exception:
                  pass

              try:
                  videos = driver.find_elements(By.TAG_NAME, "video")
                  debug["video_elements"] = []
                  for i, v in enumerate(videos):
                      rec = {
                          "src": v.get_attribute("src"),
                          "currentSrc": driver.execute_script("return arguments[0].currentSrc || ''", v),
                          "outerHTML": (v.get_attribute("outerHTML") or "")[:4000],
                      }
                      debug["video_elements"].append(rec)
                      add(rec["currentSrc"], f"video[{i}].currentSrc")
                      add(rec["src"], f"video[{i}].src")
                      try:
                          for s in v.find_elements(By.TAG_NAME, "source"):
                              add(s.get_attribute("src"), f"video[{i}].source")
                      except Exception:
                          pass
              except Exception as e:
                  debug["errors"].append("video elements: " + repr(e))

              try:
                  resources = driver.execute_script("""
                    return performance.getEntriesByType('resource').map(x => ({
                      name: x.name, initiatorType: x.initiatorType
                    }));
                  """) or []
                  debug["resources"] = resources[-1000:]
                  for x in resources:
                      u = x.get("name")
                      it = (x.get("initiatorType") or "").lower()
                      low = (u or "").lower()
                      if it in {"video", "media"} or any(k in low for k in [
                          ".mp4", ".m3u8", "douyinvod", "video/tos", "play_addr", "playwm"
                      ]):
                          add(u, "performance.resource", it)
              except Exception as e:
                  debug["errors"].append("performance resources: " + repr(e))

              try:
                  logs = driver.get_log("performance")
                  debug["performance_log_count"] = len(logs)
                  for entry in logs:
                      try:
                          msg = json.loads(entry["message"])["message"]
                          if msg.get("method") != "Network.responseReceived":
                              continue
                          params = msg.get("params") or {}
                          resp = params.get("response") or {}
                          u = resp.get("url") or ""
                          mime = (resp.get("mimeType") or "").lower()
                          rtype = (params.get("type") or "").lower()
                          low = u.lower()
                          if rtype == "media" or mime.startswith("video/") or any(k in low for k in [
                              ".mp4", ".m3u8", "douyinvod", "video/tos", "play_addr", "playwm"
                          ]):
                              add(u, "performance.log", mime or rtype)
                      except Exception:
                          pass
              except Exception as e:
                  debug["errors"].append("performance log: " + repr(e))

              cookies = driver.get_cookies()
              debug["cookie_count"] = len(cookies)
              debug["cookie_names"] = [c.get("name") for c in cookies]
              (out / "douyin_browser.html").write_text(driver.page_source, encoding="utf-8", errors="ignore")
          finally:
              try:
                  ua = driver.execute_script("return navigator.userAgent")
              except Exception:
                  ua = "Mozilla/5.0"
              try:
                  cookies = driver.get_cookies()
              except Exception:
                  cookies = []
              driver.quit()

          session = requests.Session()
          for c in cookies:
              try:
                  session.cookies.set(c["name"], c["value"], domain=c.get("domain"), path=c.get("path", "/"))
              except Exception:
                  pass

          def score(item):
              u, source, mime = item
              s = 0
              low = u.lower()
              if mime.startswith("video/"): s += 100
              if "video/tos" in low or "douyinvod" in low: s += 80
              if ".mp4" in low: s += 60
              if ".m3u8" in low: s += 50
              if "currentSrc" in source: s += 40
              if "performance.log" in source: s += 20
              return s

          candidates.sort(key=score, reverse=True)
          for idx, (url, source, mime) in enumerate(candidates[:40]):
              try:
                  headers = {
                      "User-Agent": ua,
                      "Referer": target,
                      "Accept": "*/*",
                      "Sec-Fetch-Dest": "video",
                      "Sec-Fetch-Mode": "no-cors",
                      "Sec-Fetch-Site": "cross-site",
                  }
                  if ".m3u8" in url.lower():
                      continue
                  r = session.get(url, headers=headers, stream=True, timeout=60, allow_redirects=True)
                  ct = (r.headers.get("content-type") or "").lower()
                  if r.status_code not in (200, 206):
                      debug["errors"].append(f"candidate {idx} status {r.status_code}: {url[:180]}")
                      continue
                  if ct.startswith(("text/", "application/json", "image/")):
                      continue
                  tmp = out / "video.mp4"
                  total = 0
                  with tmp.open("wb") as fp:
                      for chunk in r.iter_content(1024 * 1024):
                          if chunk:
                              fp.write(chunk)
                              total += len(chunk)
                  if total > 100_000:
                      debug["selected"] = {
                          "url": url,
                          "source": source,
                          "mime_hint": mime,
                          "content_type": ct,
                          "bytes": total,
                          "status": r.status_code,
                          "final_url": r.url,
                      }
                      report["douyin_browser_fallback"] = debug["selected"]
                      result_path.write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding="utf-8")
                      break
                  tmp.unlink(missing_ok=True)
              except Exception as e:
                  debug["errors"].append(f"candidate {idx}: {type(e).__name__}: {e}")

          (out / "douyin_browser_debug.json").write_text(
              json.dumps(debug, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          PY
            python /tmp/douyin_browser_extract.py || true
          fi
          ls -lah output || true

      - name: Extract audio
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          VID="$(find output -maxdepth 1 -type f \( -name 'video.mp4' -o -name 'video.webm' -o -name 'video.mkv' \) | head -n1)"
          if [ -n "$VID" ]; then
            ffmpeg -y -i "$VID" -vn -ac 1 -ar 16000 -c:a pcm_s16le output/audio.wav
          fi
          ls -lah output || true

      - name: Transcribe actual audio
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          if [ -s output/audio.wav ]; then
            cat > /tmp/transcribe.py <<'PY'
          import json
          from pathlib import Path
          from faster_whisper import WhisperModel

          audio = "output/audio.wav"
          model = WhisperModel("small", device="cpu", compute_type="int8")
          segments, info = model.transcribe(
              audio,
              language="zh",
              beam_size=5,
              vad_filter=True,
              condition_on_previous_text=True,
          )

          rows = []
          lines = []
          for s in segments:
              text = s.text.strip()
              rows.append({
                  "start": round(s.start, 3),
                  "end": round(s.end, 3),
                  "text": text,
              })
              lines.append(f"[{s.start:8.2f} - {s.end:8.2f}] {text}")

          Path("output/transcript.txt").write_text("\n".join(lines), encoding="utf-8")
          Path("output/transcript.json").write_text(
              json.dumps(
                  {
                      "language": info.language,
                      "language_probability": info.language_probability,
                      "duration": info.duration,
                      "segments": rows,
                  },
                  ensure_ascii=False,
                  indent=2,
              ),
              encoding="utf-8",
          )
          print("\n".join(lines))
          PY
            python /tmp/transcribe.py
          fi

      - name: Write run summary
        if: always()
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          result_path = Path("output/result.json")
          transcript_path = Path("output/transcript.txt")

          print("# Toutiao extraction")
          if result_path.exists():
              result = json.loads(result_path.read_text(encoding="utf-8"))
              print(f"- Video ID: {result.get('video_id', '')}")
              print(f"- Title: {result.get('title', '')}")
              dl = result.get("download") or {}
              print(f"- Media type: {dl.get('content_type', '')}")
              print(f"- Downloaded bytes: {dl.get('bytes', '')}")
              print(f"- Errors: {len(result.get('errors') or [])}")
          if transcript_path.exists():
              text_value = transcript_path.read_text(encoding="utf-8")
              print("\n## Transcript preview\n")
              print("~~~text")
              print(text_value[:4000])
              print("~~~")
          PY

      - name: Validate output
        if: always()
        shell: bash
        run: |
          test -s output/result.json
          test -s output/video.mp4
          test -s output/transcript.txt
          echo "Extraction validated."

      - name: Upload extraction artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toutiao-extract-${{ github.run_id }}
          path: output/
          if-no-files-found: error
          retention-days: 7

name: Douyin CDN Fallback

on:
  push:
    paths:
      - ".requests/douyin-cdn-*"

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve request
        shell: bash
        run: |
          set -euo pipefail
          REQUEST_FILE="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep '^.requests/douyin-cdn-' | head -n1)"
          test -n "$REQUEST_FILE"
          URL="$(cat "$REQUEST_FILE")"
          test -n "$URL"
          echo "REQUEST_FILE=$REQUEST_FILE" >> "$GITHUB_ENV"
          {
            echo 'MEDIA_URL<<EOF'
            echo "$URL"
            echo 'EOF'
          } >> "$GITHUB_ENV"

      - name: Download direct Douyin CDN video
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          curl -fL --retry 3 --retry-all-errors             -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140.0.0.0 Safari/537.36"             -e "https://www.douyin.com/"             "$MEDIA_URL"             -o output/video.mp4
          test -s output/video.mp4
          ffprobe -v error             -show_entries format=duration,size             -show_entries stream=codec_name,codec_type,width,height,r_frame_rate             -of json output/video.mp4 > output/media_info.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          info=json.loads(Path("output/media_info.json").read_text())
          out={
            "source":"douyin-cdn-fallback",
            "request_file":os.environ.get("REQUEST_FILE"),
            "media_url":os.environ.get("MEDIA_URL"),
            "media_info":info,
          }
          Path("output/result.json").write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding="utf-8")
          PY

      - name: Validate output
        shell: bash
        run: |
          test -s output/video.mp4
          test -s output/media_info.json
          test -s output/result.json

      - name: Upload extraction artifact
        uses: actions/upload-artifact@v4
        with:
          name: douyin-cdn-fallback-${{ github.run_id }}
          path: output/
          if-no-files-found: error
          retention-days: 7

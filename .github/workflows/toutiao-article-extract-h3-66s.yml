name: Extract Toutiao article

on:
  push:
    branches:
      - toutiao-article-extract-h3-66s
    paths:
      - ".github/toutiao-extract/request.json"
      - "tools/toutiao_article_extract.py"
      - "tools/toutiao_mirror_extract.py"
      - ".github/workflows/toutiao-article-extract-h3-66s.yml"
  workflow_dispatch:
    inputs:
      url:
        description: "Toutiao short/article URL. Empty = request.json"
        required: false
        type: string
      mirror_url:
        description: "Optional exact-title/source mirror URL for image fallback"
        required: false
        type: string
      skip_redfox:
        description: "Skip RedFox fallback"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REDFOX_API_KEY: ${{ secrets.REDFOX_API_KEY }}
      INPUT_URL: ${{ inputs.url }}
      INPUT_MIRROR_URL: ${{ inputs.mirror_url }}
      INPUT_SKIP_REDFOX: ${{ inputs.skip_redfox }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests curl_cffi parsel lxml

      - name: Resolve request
        run: |
          mkdir -p output
          python - <<'PY'
          import json, os, pathlib

          request_path = pathlib.Path(".github/toutiao-extract/request.json")
          request = json.loads(request_path.read_text("utf-8")) if request_path.exists() else {}

          url = os.getenv("INPUT_URL", "").strip() or str(request.get("url") or "").strip()
          mirror = os.getenv("INPUT_MIRROR_URL", "").strip()
          if not mirror:
              mirror = str(request.get("mirror_url") or "").strip()

          raw_skip = os.getenv("INPUT_SKIP_REDFOX", "").strip().lower()
          if raw_skip in ("true", "false"):
              skip_redfox = raw_skip == "true"
          else:
              skip_redfox = bool(request.get("skip_redfox", False))

          download_images = bool(request.get("download_images", True))

          if not url:
              raise SystemExit("No Toutiao URL in workflow input or request.json")

          resolved = {
              "url": url,
              "mirror_url": mirror,
              "skip_redfox": skip_redfox,
              "download_images": download_images,
          }
          pathlib.Path("output/request.resolved.json").write_text(
              json.dumps(resolved, ensure_ascii=False, indent=2), encoding="utf-8"
          )

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fh:
              fh.write(f"TOUTIAO_URL={url}\n")
              fh.write(f"MIRROR_URL={mirror}\n")
              fh.write(f"SKIP_REDFOX={'1' if skip_redfox else '0'}\n")
              fh.write(f"DOWNLOAD_IMAGES={'1' if download_images else '0'}\n")
          print(json.dumps(resolved, ensure_ascii=False))
          PY

      - name: Extract Toutiao article
        id: extract
        continue-on-error: true
        run: |
          python tools/toutiao_article_extract.py "$TOUTIAO_URL" --out output

      - name: Recover images from mirror
        if: always()
        run: |
          if [ -z "$MIRROR_URL" ]; then
            echo "No mirror_url configured; skip mirror fallback."
            exit 0
          fi
          if [ "$DOWNLOAD_IMAGES" = "1" ]; then
            python tools/toutiao_mirror_extract.py "$MIRROR_URL" --out output --download
          else
            python tools/toutiao_mirror_extract.py "$MIRROR_URL" --out output
          fi

      - name: Diagnostics
        if: always()
        run: |
          echo "===== FILES ====="
          find output -maxdepth 2 -type f -printf '%p %s bytes\n' | sort || true
          echo "===== RESULT ====="
          cat output/result.json || true
          echo "===== MIRROR ====="
          cat output/mirror_images.json || true
          echo "===== ARTICLE ====="
          cat output/article.md || true

      - name: Persist latest extraction metadata
        if: always()
        run: |
          mkdir -p extracted/toutiao-h3-66s
          for f in result.json article.md mirror_images.json request.resolved.json; do
            cp -f "output/$f" "extracted/toutiao-h3-66s/$f" 2>/dev/null || true
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extracted/toutiao-h3-66s
          if ! git diff --cached --quiet; then
            git commit -m "Persist latest Toutiao extraction metadata"
            git push origin HEAD:toutiao-article-extract-h3-66s
          fi

      - name: Upload extraction artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toutiao-article-extract-${{ github.run_id }}
          path: output/
          if-no-files-found: warn
          retention-days: 3

name: Extract Toutiao article H3 66s

on:
  push:
    branches:
      - toutiao-article-extract-h3-66s
    paths:
      - "tools/toutiao_article_extract.py"
      - ".github/workflows/toutiao-article-extract-h3-66s.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REDFOX_API_KEY: ${{ secrets.REDFOX_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests curl_cffi parsel lxml

      - name: Extract article
        id: extract
        continue-on-error: true
        run: |
          rm -rf output
          mkdir -p output
          python tools/toutiao_article_extract.py "https://m.toutiao.com/is/8EuPXqpA--8/" --out output

      - name: Fetch mirror diagnostic
        if: always()
        run: |
          python - <<'PY'
          import json, requests, pathlib, zipfile
          from urllib.parse import urlsplit, urlunsplit
          from parsel import Selector

          url = "https://www.yeeyi.com/news/details/3233779/"
          headers = {
              "User-Agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/130 Safari/537.36",
              "Referer":"https://www.yeeyi.com/",
          }
          r = requests.get(url, timeout=40, headers=headers)
          r.raise_for_status()
          pathlib.Path("output/mirror.html").write_text(r.text,encoding="utf-8",errors="ignore")

          sel = Selector(text=r.text)
          raw = sel.xpath('//script[@id="__NEXT_DATA__"]/text()').get()
          if not raw:
              raise RuntimeError("__NEXT_DATA__ missing")
          data = json.loads(raw)
          info = data["props"]["pageProps"]["newsDetail"]["newsInfo"]
          content = info.get("content") or ""
          body = Selector(text=content)
          urls=[]
          for u in body.xpath("//img/@src | //img/@data-src | //img/@data-original").getall():
              u=(u or "").strip()
              if u and u not in urls:
                  urls.append(u)

          outdir=pathlib.Path("output/images")
          outdir.mkdir(parents=True,exist_ok=True)
          manifest=[]
          for i,u in enumerate(urls,1):
              parts=urlsplit(u)
              original=urlunsplit((parts.scheme,parts.netloc,parts.path,"",""))
              ext=pathlib.Path(parts.path).suffix.lower()
              if ext not in (".jpg",".jpeg",".png",".webp",".gif"):
                  ext=".bin"
              path=outdir/f"{i:02d}{ext}"
              resp=None
              used=original
              try:
                  resp=requests.get(original,timeout=40,headers=headers)
                  if resp.status_code>=400 or not resp.content:
                      raise RuntimeError(f"HTTP {resp.status_code}")
              except Exception:
                  used=u
                  resp=requests.get(u,timeout=40,headers=headers)
                  resp.raise_for_status()
              path.write_bytes(resp.content)
              manifest.append({
                  "index":i,"url":u,"download_url":used,"file":path.name,
                  "bytes":len(resp.content),"content_type":resp.headers.get("content-type","")
              })
              print(i,path.name,len(resp.content),resp.headers.get("content-type",""))

          pathlib.Path("output/mirror_images.json").write_text(
              json.dumps({
                  "status":r.status_code,"final_url":str(r.url),"bytes":len(r.content),
                  "title":info.get("title"),"source":info.get("froms"),
                  "image_count":len(urls),"images":manifest
              },ensure_ascii=False,indent=2),encoding="utf-8"
          )
          with zipfile.ZipFile("output/article_images.zip","w",zipfile.ZIP_DEFLATED) as z:
              for m in manifest:
                  z.write(outdir/m["file"], arcname=m["file"])
              z.write("output/mirror_images.json", arcname="manifest.json")
          print("mirror",r.status_code,len(r.content),"images",len(urls))
          PY

      - name: Diagnostics
        if: always()
        run: |
          echo "===== FILES ====="
          find output -maxdepth 1 -type f -printf '%f %s bytes\n' | sort || true
          echo "===== RESULT ====="
          cat output/result.json || true
          echo "===== ARTICLE ====="
          cat output/article.md || true

      - name: Persist extraction result to branch
        if: always()
        run: |
          mkdir -p extracted/toutiao-h3-66s
          cp -f output/result.json extracted/toutiao-h3-66s/result.json 2>/dev/null || true
          cp -f output/article.md extracted/toutiao-h3-66s/article.md 2>/dev/null || true
          cp -f output/shortlink_response.html extracted/toutiao-h3-66s/shortlink_response.html 2>/dev/null || true
          cp -f output/article_desktop.html extracted/toutiao-h3-66s/article_desktop.html 2>/dev/null || true
          cp -f output/article_mobile.html extracted/toutiao-h3-66s/article_mobile.html 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extracted/toutiao-h3-66s
          if ! git diff --cached --quiet; then
            git commit -m "Persist Toutiao H3 article extraction result"
            git push origin HEAD:toutiao-article-extract-h3-66s
          fi

      - name: Upload extraction artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toutiao-h3-66s-article
          path: output/
          if-no-files-found: warn
          retention-days: 3

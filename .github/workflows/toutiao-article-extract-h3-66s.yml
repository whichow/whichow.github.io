name: Extract Toutiao article H3 66s

on:
  push:
    branches:
      - toutiao-article-extract-h3-66s
    paths:
      - "tools/toutiao_article_extract.py"
      - ".github/workflows/toutiao-article-extract-h3-66s.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REDFOX_API_KEY: ${{ secrets.REDFOX_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests curl_cffi parsel lxml

      - name: Extract article
        id: extract
        continue-on-error: true
        run: |
          rm -rf output
          mkdir -p output
          python tools/toutiao_article_extract.py "https://m.toutiao.com/is/8EuPXqpA--8/" --out output

      - name: Diagnostics
        if: always()
        run: |
          echo "===== FILES ====="
          find output -maxdepth 1 -type f -printf '%f %s bytes\n' | sort || true
          echo "===== RESULT ====="
          cat output/result.json || true
          echo "===== ARTICLE ====="
          cat output/article.md || true

      - name: Persist extraction result to branch
        if: always()
        run: |
          mkdir -p extracted/toutiao-h3-66s
          cp -f output/result.json extracted/toutiao-h3-66s/result.json 2>/dev/null || true
          cp -f output/article.md extracted/toutiao-h3-66s/article.md 2>/dev/null || true
          cp -f output/shortlink_response.html extracted/toutiao-h3-66s/shortlink_response.html 2>/dev/null || true
          cp -f output/article_desktop.html extracted/toutiao-h3-66s/article_desktop.html 2>/dev/null || true
          cp -f output/article_mobile.html extracted/toutiao-h3-66s/article_mobile.html 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extracted/toutiao-h3-66s
          if ! git diff --cached --quiet; then
            git commit -m "Persist Toutiao H3 article extraction result"
            git push origin HEAD:toutiao-article-extract-h3-66s
          fi

      - name: Upload extraction artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toutiao-h3-66s-article
          path: output/
          if-no-files-found: warn
          retention-days: 3

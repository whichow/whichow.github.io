name: Extract Toutiao article H3 66s

on:
  push:
    branches:
      - toutiao-article-extract-h3-66s
    paths:
      - "tools/toutiao_article_extract.py"
      - ".github/workflows/toutiao-article-extract-h3-66s.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests curl_cffi parsel lxml

      - name: Extract article
        id: extract
        continue-on-error: true
        run: |
          rm -rf output
          mkdir -p output
          python tools/toutiao_article_extract.py "https://m.toutiao.com/is/iNw5XJvO-Qw/" --out output

      - name: Diagnostics
        if: always()
        run: |
          echo "===== FILES ====="
          find output -maxdepth 1 -type f -printf '%f %s bytes\n' | sort || true
          echo "===== RESULT ====="
          cat output/result.json || true
          echo "===== ARTICLE ====="
          cat output/article.md || true

      - name: Upload extraction artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toutiao-h3-66s-article
          path: output/
          if-no-files-found: warn
          retention-days: 3

name: Temp Toutiao Fast Extract pph
on:
  push:
    paths:
      - ".requests/toutiao-fast-pph-*"
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal deps
        run: pip install requests curl_cffi
      - name: Extract media
        shell: bash
        run: |
          rm -rf output
          mkdir -p output
          python tools/toutiao_video_extract.py "https://m.toutiao.com/is/pphwBA5iRCk/" --out output || true
          test -s output/result.json
          if [ -s output/video.mp4 ]; then
            ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,codec_type,width,height -of json output/video.mp4 > output/media_info.json || true
          fi
          find output -maxdepth 2 -type f -printf '%p %s bytes\n'
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toutiao-fast-pph-${{ github.run_id }}
          path: output/
          if-no-files-found: error
          retention-days: 7

name: WeChat RSS Login

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/wechat-rss-login.yml"

permissions:
  contents: write
  actions: read

concurrency:
  group: wechat-rss-state
  cancel-in-progress: false

jobs:
  login:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    env:
      LOGIN_QR_ATTEMPTS: "7"
      LOGIN_QR_WINDOW: "225"

    steps:
      - name: Checkout site repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Checkout pinned WechRss core
        shell: bash
        run: |
          rm -rf .vendor/wechrss
          mkdir -p .vendor/wechrss
          git init .vendor/wechrss
          git -C .vendor/wechrss remote add origin https://github.com/johamwon/wechrss.git
          git -C .vendor/wechrss fetch --depth 1 origin a99675f7ef1f3d457991d441a9124d3f6666bd45
          git -C .vendor/wechrss checkout --detach FETCH_HEAD

      - name: Install login dependencies
        run: python -m pip install requests beautifulsoup4 "qrcode[pil]"

      - name: Generate QR, wait for scan, and create private state
        run: python .github/wechat-rss/login.py

      - name: Save private login state
        uses: actions/upload-artifact@v4
        with:
          name: wechat-rss-state
          path: |
            .state/credentials.json
            .state/wechat_mp.db
          retention-days: 90
          include-hidden-files: true

name: Zhihu Extract 2085400278489101833

on:
  push:
    branches:
      - zhihu-extract-2085400278489101833
    paths:
      - ".github/workflows/zhihu-extract.yml"

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ShareXtract
        run: |
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/wuaishare/sharextract.git"

      - name: Extract article
        shell: bash
        run: |
          mkdir -p output
          URL="https://zhuanlan.zhihu.com/p/2085400278489101833"
          set +e
          sharextract "$URL" --format json -o output/result.json >output/stdout-json.log 2>output/stderr-json.log
          echo $? > output/json-exit.txt
          sharextract "$URL" --format markdown -o output/result.md >output/stdout-md.log 2>output/stderr-md.log
          echo $? > output/md-exit.txt
          set -e
          ls -lah output
          cat output/stderr-json.log || true
          cat output/stderr-md.log || true

      - name: Upload extraction artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zhihu-extract-${{ github.run_id }}
          path: output/
          if-no-files-found: error
          retention-days: 7

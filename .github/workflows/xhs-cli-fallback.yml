name: XHS yt-dlp fallback

on:
  push:
    branches:
      - xhs-media-extract
    paths:
      - ".github/xhs-cli-trigger.txt"

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install downloader
        run: |
          pip install -U "yt-dlp[default,curl-cffi]"

      - name: Download Xiaohongshu video
        continue-on-error: true
        run: |
          rm -rf xhs_ytdlp_output
          mkdir -p xhs_ytdlp_output
          URL1='https://www.xiaohongshu.com/discovery/item/6ac205d3000000001801485e?app_platform=android&ignoreEngage=true&app_version=9.49.1&share_from_user_hidden=true&xsec_source=app_share&type=video&xsec_token=CBR32ELwc6r_qQEdpn3uD4hD2mSxwEM_YjU1HuIgzaFG0%3D&author_share=1&xhsshare=CopyLink&shareRedId=ODhGQUY4SDs2NzUyOTgwNjdIOThISEo8&apptime=1791883253&share_id=26e8d0f6273c454eac3be5f2b93838f4&share_channel=copy_link&track_code=6gtD6j78AtT'
          URL2='https://xhslink.cn/o/6gtD6j78AtT'
          set +e
          yt-dlp -v --no-playlist --impersonate chrome -f 'bestvideo+bestaudio/best' --merge-output-format mp4 -o 'xhs_ytdlp_output/video.%(ext)s' "$URL1" 2>&1 | tee xhs_ytdlp_output/attempt1.log
          RC1=${PIPESTATUS[0]}
          if ! find xhs_ytdlp_output -maxdepth 1 -type f -name 'video.*' | grep -q .; then
            yt-dlp -v --no-playlist --impersonate chrome -f 'bestvideo+bestaudio/best' --merge-output-format mp4 -o 'xhs_ytdlp_output/video.%(ext)s' "$URL2" 2>&1 | tee xhs_ytdlp_output/attempt2.log
            RC2=${PIPESTATUS[0]}
          else
            RC2=0
          fi
          set -e
          VID="$(find xhs_ytdlp_output -maxdepth 1 -type f -name 'video.*' ! -name '*.part' | head -n1)"
          if [ -n "$VID" ] && [ -s "$VID" ]; then
            if [ "$VID" != "xhs_ytdlp_output/video.mp4" ]; then
              ffmpeg -y -i "$VID" -c copy xhs_ytdlp_output/video.mp4
            fi
            ffprobe -v error -show_entries format=duration,size,bit_rate:stream=index,codec_name,width,height,r_frame_rate -of json xhs_ytdlp_output/video.mp4 > xhs_ytdlp_output/probe.json
            echo '{"success":true}' > xhs_ytdlp_output/status.json
          else
            printf '{"success":false,"attempt1":%s,"attempt2":%s}\n' "$RC1" "$RC2" > xhs_ytdlp_output/status.json
            exit 1
          fi

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xhs-ytdlp-fallback-${{ github.run_id }}
          path: xhs_ytdlp_output/
          if-no-files-found: warn
          retention-days: 7

name: WeChat RSS Sync

on:
  push:
    paths:
      - ".github/workflows/wechat-rss-sync.yml"
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      source:
        description: "可选：公众号准确名称或微信号；留空则同步已有订阅"
        required: false
        type: string
      name:
        description: "可选：自定义显示名称"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: wechat-rss-sogou
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ADD_SOURCE: ${{ inputs.source }}
      ADD_NAME: ${{ inputs.name }}
      MAX_ITEMS: "120"
      REQUEST_TIMEOUT: "20"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lightweight dependencies
        run: python -m pip install requests beautifulsoup4

      - name: Sync public WeChat search results
        run: python .github/wechat-rss/sync.py

      - name: Commit generated feeds
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wechat-rss
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "chore: update WeChat RSS [skip ci]"
          git pull --rebase
          git push

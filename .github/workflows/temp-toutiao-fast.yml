name: Temp Toutiao Fast Extract
on:
  push:
    paths:
      - ".requests/toutiao-fast-hd-*"
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal deps
        run: pip install requests curl_cffi
      - name: Extract HD
        shell: bash
        run: |
          rm -rf output
          mkdir -p output
          python tools/toutiao_video_extract.py "https://m.toutiao.com/is/tfhz91OTEHM/" --out output
          python - <<'PY'
          import json, pathlib, requests
          p=pathlib.Path("output/result.json")
          d=json.loads(p.read_text(encoding="utf-8"))
          cand=None
          for x in d.get("media_candidates",[]):
              path=x.get("path","")
              if ".720p." in path and "MainPlayUrl" in path:
                  cand=x
                  break
          if cand:
              url=cand["url"]
              r=requests.get(url,headers={"User-Agent":"Mozilla/5.0","Referer":"https://www.toutiao.com/"},timeout=120)
              r.raise_for_status()
              pathlib.Path("output/video.mp4").write_bytes(r.content)
              d["selected_media_hd"]=cand
              d["download_hd"]={"bytes":len(r.content),"status":r.status_code,"content_type":r.headers.get("content-type","")}
              p.write_text(json.dumps(d,ensure_ascii=False,indent=2),encoding="utf-8")
          PY
          test -s output/video.mp4
          find output -maxdepth 2 -type f -printf '%p %s bytes\n'
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: toutiao-fast-hd-${{ github.run_id }}
          path: output/
          if-no-files-found: error
          retention-days: 7

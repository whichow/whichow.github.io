name: Temp Toutiao Auto Extract L5K
on:
  push:
    paths:
      - ".requests/toutiao-auto-l5k-*"
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal deps
        run: pip install requests curl_cffi
      - name: Auto extract
        shell: bash
        run: |
          rm -rf output
          mkdir -p output
          python tools/toutiao_video_extract.py "https://m.toutiao.com/is/L5KGEkVhlN8/" --out output || true
          if [ -s output/video.mp4 ]; then
            ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,codec_type,width,height -of json output/video.mp4 > output/media_info.json || true
            echo video > output/media_type.txt
          else
            rm -rf output
            python tools/toutiao_image_extract.py "https://m.toutiao.com/is/L5KGEkVhlN8/" --out output
            echo images > output/media_type.txt
          fi
          find output -maxdepth 2 -type f -printf '%p %s bytes\n'
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toutiao-auto-l5k-${{ github.run_id }}
          path: output/
          if-no-files-found: error
          retention-days: 7

name: WeChat one-shot public proxy test

on:
  push:
    paths:
      - ".github/workflows/wechat-oneshot-proxy.yml"

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Try public readers
        env:
          ARTICLE_URL: "https://mp.weixin.qq.com/s/h9NZURE7dASUvwJaFcjbRg"
        shell: bash
        run: |
          python - <<'PY'
          import os, urllib.parse, urllib.request

          target = os.environ["ARTICLE_URL"]

          def fetch(label, url, headers=None):
              print("\n===== " + label + " =====")
              req = urllib.request.Request(url, headers=headers or {"User-Agent":"Mozilla/5.0"})
              try:
                  with urllib.request.urlopen(req, timeout=35) as r:
                      raw = r.read(200000)
                      text = raw.decode("utf-8", "replace")
                      print("STATUS", r.status)
                      print("FINAL_URL", r.geturl())
                      print(text[:30000])
              except Exception as e:
                  print("ERROR", type(e).__name__, str(e))

          q = urllib.parse.urlencode({"id":"88888888","key":"88888888","url":target})
          fetch("APIHZ", "https://cn.apihz.cn/api/caiji/wx.php?" + q)
          fetch("JINA", "https://r.jina.ai/https://mp.weixin.qq.com/s/h9NZURE7dASUvwJaFcjbRg")
          fetch("DEFUDDLE", "https://defuddle.md/https://mp.weixin.qq.com/s/h9NZURE7dASUvwJaFcjbRg")
          PY

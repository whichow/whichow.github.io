name: Xiaohongshu Profile Extractor

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Xiaohongshu profile share URL or full share text"
        required: true
        type: string

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"

      - name: Resolve profile share
        shell: bash
        env:
          RAW_INPUT: ${{ inputs.url }}
        run: |
          set -euo pipefail
          rm -rf output
          mkdir -p output
          python -m pip install requests
          python - <<'PY'
          import os, re, json, urllib.parse, requests, pathlib
          raw=os.environ["RAW_INPUT"]
          m=re.search(r'https?://(?:(?:www\.)?xiaohongshu\.com|(?:www\.)?xhslink\.(?:com|cn))/[^\s]+', raw, re.I)
          if not m:
              raise SystemExit("No Xiaohongshu URL found")
          url=m.group(0).rstrip('，。,.!！?？;；')
          ua="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131.0.0.0 Safari/537.36"
          r=requests.get(url,headers={"User-Agent":ua},allow_redirects=True,timeout=25)
          final=r.url
          target=final
          q=urllib.parse.parse_qs(urllib.parse.urlparse(final).query)
          if "/login" in urllib.parse.urlparse(final).path and q.get("redirectPath"):
              target=urllib.parse.unquote(q["redirectPath"][0])
          mm=re.search(r'/user/profile/([0-9A-Za-z]+)', target)
          if not mm:
              raise SystemExit(f"Resolved target is not a profile: {final}")
          uid=mm.group(1)
          pathlib.Path("output/user_id.txt").write_text(uid,encoding="utf-8")
          pathlib.Path("output/profile_target_url.txt").write_text(target,encoding="utf-8")
          pathlib.Path("output/resolve.json").write_text(json.dumps({
              "share_url":url,"final_url":final,"target_url":target,"user_id":uid
          },ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps({"user_id":uid,"target_url":target},ensure_ascii=False))
          PY

      - name: Prepare anonymous XHS CLI
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/xhs-cli
          git clone https://github.com/tamnd/xiaohongshu-cli.git /tmp/xhs-cli
          cd /tmp/xhs-cli
          git checkout b60f9a384ed32d002aaacbbff95fedb2bdc96682
          go build -o /tmp/xhs ./cmd/xhs
          /tmp/xhs --help >/dev/null

      - name: Read public profile and first-page notes
        shell: bash
        run: |
          set -euo pipefail
          XHS_UID="$(cat output/user_id.txt)"
          export XHS_CACHE_DIR=/tmp/xhs-cache
          export XHS_CONFIG_DIR=/tmp/xhs-config
          /tmp/xhs -o json user "$XHS_UID" > output/profile_cli.json
          /tmp/xhs -o json -n 20 user "$XHS_UID" --notes > output/notes_cli.json
          cat output/profile_cli.json
          cat output/notes_cli.json

      - name: Normalize profile result
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib
          profile_arr=json.loads(pathlib.Path("output/profile_cli.json").read_text(encoding="utf-8"))
          notes=json.loads(pathlib.Path("output/notes_cli.json").read_text(encoding="utf-8"))
          resolve=json.loads(pathlib.Path("output/resolve.json").read_text(encoding="utf-8"))
          profile=profile_arr[0] if profile_arr else {}
          latest=notes[0] if notes else None
          latest_url=(latest or {}).get("url","")
          out={
              "share_url":resolve.get("share_url"),
              "target_url":resolve.get("target_url"),
              "user_id":resolve.get("user_id"),
              "profile":profile,
              "visible_note_count":len(notes),
              "notes":notes,
              "latest_note":latest,
              "latest_note_url":latest_url,
              "errors":[]
          }
          pathlib.Path("output/profile.json").write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding="utf-8")
          pathlib.Path("output/latest_note_url.txt").write_text(latest_url,encoding="utf-8")
          print(json.dumps({
              "nickname":profile.get("nickname"),
              "fans":profile.get("fans"),
              "follows":profile.get("follows"),
              "interaction":profile.get("interaction"),
              "visible_note_count":len(notes),
              "latest_note":latest
          },ensure_ascii=False,indent=2))
          PY

      - name: Prepare pinned Shizhen media parser
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/shizhen
          git clone https://github.com/hiyufan/shizhen.git /tmp/shizhen
          cd /tmp/shizhen
          git checkout f25a6a7da753e71888a3fec00b8b4a85610f890e
          python -m pip install -e .

      - name: Extract latest public note media
        if: success()
        shell: bash
        env:
          PYTHONPATH: /tmp/shizhen/src
        run: |
          set -euo pipefail
          URL="$(cat output/latest_note_url.txt)"
          if [ -n "$URL" ]; then
            python tools/xiaohongshu_extract.py "$URL" --out output/latest_note
          fi
          find output -maxdepth 3 -type f -printf '%p %s bytes\n'

      - name: Validate output
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib
          r=json.loads(pathlib.Path("output/profile.json").read_text(encoding="utf-8"))
          assert r.get("profile",{}).get("nickname"), "missing nickname"
          assert isinstance(r.get("notes"),list), "missing notes"
          if r.get("latest_note_url"):
              p=pathlib.Path("output/latest_note/result.json")
              assert p.exists(), "latest note media missing"
              nr=json.loads(p.read_text(encoding="utf-8"))
              assert not (nr.get("errors") or []), nr.get("errors")
          print("Xiaohongshu profile output validated")
          PY

      - name: Package profile bundle
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd output
          zip -qr ../xiaohongshu-profile-bundle.zip .
          cd ..
          test -s xiaohongshu-profile-bundle.zip

      - name: Upload extraction artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xiaohongshu-profile-${{ github.run_id }}
          path: |
            output/
            xiaohongshu-profile-bundle.zip
          if-no-files-found: warn
          retention-days: 7
